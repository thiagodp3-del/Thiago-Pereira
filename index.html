<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Aplicativo desativado</title>
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14171C;color:#F2F4F6;font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:420px;text-align:center}
h1{font-size:24px;margin:0 0 10px}
p{margin:0;color:#B9C2CC}
</style></head><body><main>
<h1>Aplicativo desativado</h1>
<p>Este aplicativo foi retirado do ar.</p>
</main>
<script>
// remove o app guardado no aparelho e os dados salvos nele
try{localStorage.clear()}catch(e){}
try{sessionStorage.clear()}catch(e){}
if("caches" in window)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});
if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
try{indexedDB.databases&&indexedDB.databases().then(ds=>ds.forEach(d=>d.name&&indexedDB.deleteDatabase(d.name)))}catch(e){}
</script>
</body></html>
